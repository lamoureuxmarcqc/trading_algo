# ============================================================================
# ALEMBIC CONFIGURATION
# Institutional / Production Ready
# PostgreSQL + SQLAlchemy 2.x + psycopg3
# ============================================================================

[alembic]

# ----------------------------------------------------------------------------
# Migration script location
# ----------------------------------------------------------------------------
script_location = %(here)s/alembic

# ----------------------------------------------------------------------------
# Python path prepend
# ----------------------------------------------------------------------------
prepend_sys_path = .

# ----------------------------------------------------------------------------
# Timezone
# ----------------------------------------------------------------------------
timezone = UTC

# ----------------------------------------------------------------------------
# Migration filename template
# ----------------------------------------------------------------------------
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# ----------------------------------------------------------------------------
# Version locations
# ----------------------------------------------------------------------------
path_separator = os

# ----------------------------------------------------------------------------
# Recursive versions
# ----------------------------------------------------------------------------
recursive_version_locations = true

# ----------------------------------------------------------------------------
# Encoding
# ----------------------------------------------------------------------------
output_encoding = utf-8

# ----------------------------------------------------------------------------
# DATABASE URL
# ----------------------------------------------------------------------------
# Adapter: psycopg3
# Database: postgres
# ----------------------------------------------------------------------------

sqlalchemy.url = postgresql+psycopg://postgres:albany01@localhost:5432/postgres


# ============================================================================
# POST WRITE HOOKS
# ============================================================================

[post_write_hooks]

# ----------------------------------------------------------------------------
# BLACK formatter
# ----------------------------------------------------------------------------
hooks = black

black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

# ----------------------------------------------------------------------------
# RUFF linting (optional)
# ----------------------------------------------------------------------------
# hooks = black,ruff
#
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


# ----------------------------------------------------------------------------
# ROOT LOGGER
# ----------------------------------------------------------------------------
[logger_root]
level = WARNING
handlers = console
qualname =


# ----------------------------------------------------------------------------
# SQLALCHEMY LOGGER
# ----------------------------------------------------------------------------
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


# ----------------------------------------------------------------------------
# ALEMBIC LOGGER
# ----------------------------------------------------------------------------
[logger_alembic]
level = INFO
handlers =
qualname = alembic


# ----------------------------------------------------------------------------
# CONSOLE HANDLER
# ----------------------------------------------------------------------------
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# ----------------------------------------------------------------------------
# FORMATTER
# ----------------------------------------------------------------------------
[formatter_generic]
format = %(asctime)s | %(levelname)-5.5s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S