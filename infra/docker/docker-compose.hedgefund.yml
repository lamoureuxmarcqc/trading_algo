version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hedgefund
      POSTGRES_USER: hedgefund
      POSTGRES_PASSWORD: hedgefund
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../services/api-core/sql:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-core:
    image: python:3.11-slim
    working_dir: /workspace
    command: >
      sh -c "pip install -r services/api-core/requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir services/api-core"
    environment:
      POSTGRES_DSN: postgresql+psycopg://hedgefund:hedgefund@postgres:5432/hedgefund
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    volumes:
      - ../../:/workspace
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

