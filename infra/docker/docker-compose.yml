name: lamoureux-ai

services:
  # ─────────────────────────────── Données ───────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lamoureux-postgres
    environment:
      POSTGRES_DB: lamoureux
      POSTGRES_USER: lamoureux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamoureux"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lamoureux-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lamoureux-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────── Inférence ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: lamoureux-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREADS=8

  # ─────────────────────────────── AI Infrastructure ─────────────────────
  ai-gateway:
    build:
      context: ../../services/ai-gateway
    container_name: lamoureux-ai-gateway
    environment:
      AIGW_OLLAMA_URL: http://ollama:11434
      AIGW_OLLAMA_DEFAULT_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      AIGW_VLLM_URL: http://vllm:8000
      AIGW_LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────── API Core (existant) ───────────────────
  api-core:
    build:
      context: ../..
      dockerfile: services/api-core/Dockerfile
    container_name: lamoureux-api-core
    environment:
      DATABASE_URL: postgresql+asyncpg://lamoureux:${POSTGRES_PASSWORD:-changeme}@postgres:5432/lamoureux
      REDIS_URL: redis://redis:6379/0
      AI_GATEWAY_URL: http://ai-gateway:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-gateway:
        condition: service_started
    profiles: ["full"]   # activé avec --profile full

  # Knowledge Layer
  knowledge:
    build:
      context: ../../services/knowledge
      dockerfile: Dockerfile
    container_name: lamoureux-knowledge
    environment:
      KNOW_DATABASE_URL: postgresql+psycopg://lamoureux:${POSTGRES_PASSWORD:-changeme}@postgres:5432/lamoureux
      KNOW_RERANK_ENABLED: "true"
      KNOW_RERANK_MIN_CONFIDENCE: "0.05"
      KNOW_LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    volumes:
      - hfcache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollamadata:
  hfcache:
