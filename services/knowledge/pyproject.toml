[project]
name = "lamoureux-knowledge"
version = "0.1.0"
description = "Knowledge layer — ingestion, RAG, citations"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"